const pg=document.createElement("div");pg.id="pg";pg.setAttribute("role","dialog");pg.style.cssText="position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)";
const pill="background:var(--p);padding:8px 14px;border-radius:99px;color:var(--ac2);font-weight:600";
pg.innerHTML=`<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--p);position:sticky;top:0;z-index:2"><button class="ic" id="px" aria-label="Close">✕</button><b style="flex:1;font-size:18px">Profile</b><button class="btn" id="ps" style="width:auto;padding:9px 24px;border-radius:99px">Save</button></div>
<div style="max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px"><div id="pcv" style="height:170px;border-radius:16px;position:relative"><button id="pce" style="position:absolute;top:10px;inset-inline-end:10px;${pill}">📷 Edit</button></div>
<div style="display:grid;justify-items:center;gap:8px;margin-top:-66px;position:relative"><input id="pst" maxlength="60" value="${esc(u.stt||"")}" placeholder="What's happening?" aria-label="Status" style="width:240px;text-align:center;border-radius:99px;background:var(--p)"><div id="pav" style="width:112px;height:112px;border-radius:50%;border:4px solid var(--bg);display:grid;place-items:center;font-size:36px;color:#fff;background-size:cover;background-position:center"></div><button id="pae" style="${pill};margin-top:-28px;position:relative">📷 Edit</button></div>
<h3>Profile information</h3><label>Name<input id="pn" maxlength="30" value="${esc(u.name)}"></label><label>Description / About<input id="pa" maxlength="120" value="${esc(u.about||"")}" placeholder="Description"></label><label>Address<input id="pad" maxlength="120" value="${esc(u.addr||"")}" placeholder="Address"></label>
<label>Coverage area<select id="pcov">${["Exact location","City only","Country only"].map(x=>`<option ${u.cov==x?"selected":""}>${x}</option>`).join("")}</select></label>
<div class="row2"><small>${t("num")}</small><b>${esc(u.num)}</b></div>${u.google?`<div class="row2"><small>🔗 Google</small><b style="font-size:13px">${esc(u.id)}</b></div>`:""}
<input type="file" id="pf1" accept="image/*" hidden><input type="file" id="pf2" accept="image/*" hidden></div>`;
document.body.appendChild(pg);
const draw=()=>{$("#pcv").style.background=cv?`url("${cv}") center/cover`:"linear-gradient(135deg,var(--p2),var(--p))";const a=$("#pav");a.style.backgroundImage=ph?`url("${ph}")`:"none";a.style.backgroundColor=ph?"transparent":col[0];a.textContent=ph?"":ini(u.name)};draw();
$("#px").onclick=()=>pg.remove();$("#pce").onclick=()=>$("#pf1").click();$("#pae").onclick=()=>$("#pf2").click();
$("#pf1").onchange=e=>img2url(e.target.files[0],800,.7,x=>{cv=x;draw()});$("#pf2").onchange=e=>img2url(e.target.files[0],256,.8,x=>{ph=x;draw()});
$("#ps").onclick=()=>{const n=$("#pn").value.trim();if(!n)return toast("Name required");Object.assign(u,{name:n,about:$("#pa").value.trim(),addr:$("#pad").value.trim(),cov:$("#pcov").value,stt:$("#pst").value.trim(),photo:ph,cover:cv});{const kk=known()[kid(u.id)];kk&&(kk.name=n,kk.photo=ph||null)}save();pg.remove();pane();toast("✓ Profile updated")}}
const dd=ts=>Math.round((new Date().setHours(0,0,0,0)-new Date(ts).setHours(0,0,0,0))/864e5);
const dlabel=ts=>{const d=dd(ts);return d<=0?"Today":d==1?"Yesterday":d<7?new Date(ts).toLocaleDateString([], {weekday:"long"}):new Date(ts).toLocaleDateString([], {day:"numeric",month:"short",year:"numeric"})};
const lt=ts=>{const d=dd(ts);return d<=0?tm(ts):d==1?"Yesterday":d<7?new Date(ts).toLocaleDateString([], {weekday:"long"}):new Date(ts).toLocaleDateString([], {day:"numeric",month:"short"})};
const cav=c=>{if(c.ai)return `<div class="av ${c.on?"on":""}" aria-hidden="true">${ailogo(46)}</div>`;const s=S.sts.find(x=>x.n==c.name);return av(c.name,c.id,(c.on?"on ":"")+(s?(s.seen?"ring seen":"ring"):""))};
function showRp(){const e=$("#rps");if(!e)return;e.hidden=!rp;e.innerHTML=rp?`<button class="ic" id="rx" aria-label="Cancel reply" style="float:inline-end;width:26px;height:26px">✕</button><b>${esc(rp.n)}</b><span>${esc(rp.t)}</span>`:"";const x=$("#rx");x&&(x.onclick=()=>{rp=null;showRp()})}
function gallery(c){const m=c.msgs.filter(x=>x.u&&(x.k=="image"||x.k=="video"));const o=modal(`<b>🖼 Media</b>${m.length?`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${m.map(x=>x.k=="image"?`<img src="${x.u}" alt="" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px">`:`<video src="${x.u}" controls style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px"></video>`).join("")}</div>`:"<small>No photos or videos in this chat yet.</small>"}<button id="gx" aria-label="Close">✕</button>`);$("#gx").onclick=()=>o.remove()}
/* NETWORK */
addEventListener("offline",()=>{document.body.insertAdjacentHTML("afterbegin",`<div class="net" id="nt" role="alert">Offline — messages will be sent when you reconnect</div>`)});
addEventListener("online",()=>{const e=$("#nt");e&&e.remove();toast("Back online");if(!S.user)return;S.chats.forEach(c=>{let f=0;c.msgs.forEach(m=>{if(m.me&&m.st===0&&!c.num){m.st=c.on?2:1;f=c.on}});f&&setTimeout(()=>reply(c),500)});save();msgs();pane()});
applyTheme();S.user?shell():auth(0);

/* ASF AI */
const GEMINI_MODEL="gemini-flash-latest";/* agar model band ho jaye to yahan naya naam likhein */
async function askAI(c){if(!S.aik)return"Main abhi offline mode mein hoon 🤖 Asli jawab ke liye 🔑 ASF AI key mein apni Gemini API key daalein.";
const h=[];c.msgs.slice(-12).forEach(m=>{if(!m.t)return;const r=m.me?"user":"model";h.length&&h.at(-1).role==r?h.at(-1).parts[0].text+="\n"+m.t:h.push({role:r,parts:[{text:m.t}]})});while(h.length&&h[0].role!="user")h.shift();
const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+GEMINI_MODEL+":generateContent",{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":S.aik},body:JSON.stringify({systemInstruction:{parts:[{text:"You are ASF AI, a helpful assistant inside ASF Messenger. Reply briefly in the same language and script the user writes in (Roman Urdu stays Roman Urdu)."}]},contents:h,generationConfig:{maxOutputTokens:600}})});
const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message||r.status);return((d.candidates||[])[0]?.content?.parts||[]).map(x=>x.text||"").join("")||"(khali jawab)"}
async function aiReply(c){const id=c.id,p=()=>$("#pres");cur==id&&p()&&(p().innerHTML=`<span class="typing"><span></span><span></span><span></span></span> ${t("typing")}`);
let a;try{a=await askAI(c)}catch(e){a="Maaf kijiye, AI se rabta nahi ho saka ("+(e.message||"error")+"). Settings mein key check karein."}
c.msgs.forEach(m=>m.me&&(m.st??2)>=2&&(m.st=3));c.msgs.push({t:a,me:0,ts:Date.now()});if(cur==id){p()&&(p().textContent=t("online"));msgs()}else c.unread++;save();pane()}
function aiKey(){const o=modal(`<b>✨ ASF AI key</b><small>Apni Gemini API key (AIza...) paste karein. Ye sirf aapke browser mein save hoti hai. Is file ko key ke saath online publish na karein.</small><input id="akv" type="text" placeholder="AIza..." value="${esc(S.aik||"")}" aria-label="API key" autocomplete="off" autocapitalize="off" spellcheck="false" style="-webkit-text-security:disc"><button id="akvp" style="padding:8px;color:var(--ac2)">📋 Clipboard se paste karein</button><button class="btn" id="aks">Save</button>${S.aik?`<button id="akr" style="padding:8px;color:#e74c3c">Remove key</button>`:""}`);
$("#akvp").onclick=()=>pasteKey("#akv");$("#aks").onclick=()=>{S.aik=$("#akv").value.trim()||null;save();o.remove();pane();toast("✓ Saved")};const r=$("#akr");r&&(r.onclick=()=>{S.aik=null;save();o.remove();pane()})}
document.addEventListener("click",e=>{if(!S.user)return;if(e.target.closest("#aik"))return aiKey();if(e.target.closest("#ai")){const c=S.chats.find(x=>x.ai);if(!c)return;tab="chats";go("chats");openG(c)}});

function gcidAsk(){const o=modal(`<b>🔗 Real Google login</b><small>1) console.cloud.google.com → APIs &amp; Services → Credentials → Create OAuth client ID → Web application.<br>2) Authorized JavaScript origins mein ye daalein: <b>${esc(location.origin)}</b><br>3) Jo Client ID mile wo yahan paste karein.</small><input id="gcv" placeholder="xxxx.apps.googleusercontent.com" value="${esc(S.gcid||"")}" aria-label="Google Client ID"><button class="btn" id="gcsv">Save</button>${S.gcid?`<button id="gcr" style="padding:8px;color:#e74c3c">Remove (demo mode)</button>`:""}`);
$("#gcsv").onclick=()=>{const v=$("#gcv").value.trim();if(v&&!/\.apps\.googleusercontent\.com$/.test(v))return toast("Client ID galat lag raha hai");S.gcid=v||null;save();location.reload()};const r=$("#gcr");r&&(r.onclick=()=>{S.gcid=null;save();location.reload()})}
document.addEventListener("click",e=>{if(e.target.closest("#gcs"))gcidAsk()});

/* REAL CHAT (server.js se) */
let ws=null,wsOk=0;const pend={},SRV=location.protocol.startsWith("http")?(location.protocol=="https:"?"wss://":"ws://")+location.host:null;
function netConnect(){if(!SRV||!S.user)return;const w=ws=new WebSocket(SRV);w.uid=S.user.id;
w.onopen=()=>w.send(JSON.stringify({type:"hello",id:S.user.id,name:S.user.name,num:S.user.num}));
w.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
if(m.type=="me"&&S.user){wsOk=1;if(m.num!=S.user.num){S.user.num=m.num;const k=known()[kid(S.user.id)];k&&(k.num=m.num);save();pane()}flush()}
else if(m.type=="msg")incoming(m);else if(m.type=="found"&&pend[m.rid]){pend[m.rid](m);delete pend[m.rid]}};
w.onclose=()=>{if(ws===w){wsOk=0;ws=null}}}
setInterval(()=>{if(ws&&(!S.user||ws.uid!=S.user.id)){ws.close();ws=null;wsOk=0}if(S.user&&!ws)netConnect()},1500);
const live=()=>ws&&ws.readyState==1&&wsOk;
function netSend(c,x){if(live()){ws.send(JSON.stringify({type:"msg",to:c.num,t:x.t,ts:x.ts}));x.st=2;return 1}x.st=0;return 0}
function flush(){S.chats.forEach(c=>c.num&&c.msgs.forEach(x=>x.me&&x.st===0&&x.t&&!x.dl&&!x.u&&netSend(c,x)));save();msgs();pane()}
function lookup(num){return new Promise(res=>{if(!live())return res(null);const rid=Math.random().toString(36).slice(2);pend[rid]=res;ws.send(JSON.stringify({type:"find",num,rid}));setTimeout(()=>{if(pend[rid]){delete pend[rid];res(null)}},4000)})}
function incoming(m){let c=S.chats.find(x=>x.num&&dg(x.num)==dg(m.from));if(c&&c.blk)return;
if(!c){c={id:Date.now(),name:m.name||m.from,num:m.from,on:1,unread:0,msgs:[]};S.chats.push(c)}
c.on=1;c.msgs.push({t:m.t,me:0,ts:m.ts||Date.now()});
if(cur==c.id){c.unread=0;msgs()}else{c.unread++;if(!muted(c)&&!c.hide)toast("💬 "+c.name+": "+(c.lock?"New message":m.t))}save();pane()}

/* API key popup: app khulte hi, jab tak key save na ho */
function keyPopup(){if(keyPopup.o&&keyPopup.o.isConnected)return;
const o=keyPopup.o=modal(`<b>✨ ASF AI key</b><small>ASF AI chalane ke liye apni Gemini API key (AIza...) yahan paste karein. Ye sirf aapke browser me save hoti hai.</small><input id="akp" type="text" value="${esc(S.aik||"")}" placeholder="AIza..." aria-label="API key" autocomplete="off" autocapitalize="off" spellcheck="false" style="-webkit-text-security:disc"><button id="akpp" style="padding:8px;color:var(--ac2)">📋 Clipboard se paste karein</button><div id="ake" role="alert" style="color:#e74c3c;font-size:13px"></div><button class="btn" id="aks2">Save</button><button id="akl" style="padding:8px;color:var(--mu)">Baad me</button>`);
const done=()=>{const v=$("#akp").value.trim();if(!/^AIza/.test(v))return $("#ake").textContent="Gemini key 'AIza' se shuru hoti hai";S.aik=v;save();o.remove();toast("✓ Key save ho gayi");S.user&&pane()};
$("#akp").focus();$("#akpp").onclick=()=>pasteKey("#akp");$("#aks2").onclick=done;$("#akp").onkeydown=e=>e.key=="Enter"&&done();$("#akl").onclick=()=>o.remove()}
setTimeout(keyPopup,300);
document.addEventListener("click",e=>{if(e.target.closest("#akb"))keyPopup()});

async function pasteKey(id){const el=$(id);try{const v=await navigator.clipboard.readText();if(v){el.value=v.trim();return}}catch(e){}const v=prompt("Apni key yahan paste karein (Ctrl+V):");if(v)el.value=v.trim()}
</script></body></html>
